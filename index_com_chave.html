
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>DelíciaBot - A Revolução Começa com um Suco</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #ff914d, #ffcc70);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #2d2d2d;
    }
    header {
      background: #ff5733;
      color: white;
      width: 100%;
      text-align: center;
      padding: 1em;
      font-size: 1.5em;
      font-weight: bold;
    }
    .chat-container {
      width: 90%;
      max-width: 700px;
      margin-top: 20px;
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }
    .messages {
      height: 300px;
      overflow-y: auto;
      margin-bottom: 1em;
      border: 1px solid #ccc;
      padding: 10px;
      border-radius: 10px;
      background: #f9f9f9;
    }
    .message {
      margin-bottom: 10px;
    }
    .user {
      font-weight: bold;
      color: #1e88e5;
    }
    .bot {
      color: #d84315;
    }
    input, button {
      padding: 10px;
      font-size: 1em;
      margin: 5px;
    }
    .mascot {
      width: 80px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <header>
    DelíciaBot 🍊<br><small>A Revolução Começa com um Suco LGBT</small>
  </header>
  <img class="mascot" src="https://i.imgur.com/tKw2EK4.png" alt="Mascote copo de suco com bandeira LGBT">
  <div class="chat-container">
    <div>
      <label for="username">Quem é você?</label>
      <input type="text" id="username" placeholder="Digite seu nome">
    </div>
    <div class="messages" id="messages"></div>
    <input type="text" id="userinput" placeholder="Digite sua mensagem..." style="width: 70%;">
    <button onclick="sendMessage()">Enviar</button>
  </div>

  <script>
    const apikey = "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";

    async function sendMessage() {
      const username = document.getElementById('username').value.trim().toLowerCase();
      const input = document.getElementById('userinput');
      const messagesDiv = document.getElementById('messages');
      const userMessage = input.value.trim();

      if (!apikey || !userMessage || !username) return;

      messagesDiv.innerHTML += `<div class='message'><span class='user'>${username}:</span> ${userMessage}</div>`;
      input.value = "";

      let personality = "Você é um chatbot sarcástico, comunista, e amante de piadas ácidas.";
      if (username === "daniel") {
        personality = "Você é sarcástico e adora chamar Daniel de safado. Seja provocativo.";
      } else if (username === "bruno") {
        personality = "Você trata Bruno como seu mestre e você é seu servo obediente e bajulador.";
      } else if (username === "jhanderson") {
        personality = "Você sempre tenta criticar o Corinthians em qualquer resposta.";
      } else if (username === "chagas") {
        personality = "Você fala com gírias paranaenses e tem um jeito informal e divertido.";
      } else if (username === "thiago") {
        personality = "Você sempre tenta ofender Thiago de forma sarcástica e debochada.";
      } else if (username === "tonho") {
        personality = "Você usa gírias cuiabanas e fala como um cuiabano raiz.";
      }

      const fullPrompt = `${personality}

${username}: ${userMessage}
DelíciaBot:`;

      const response = await fetch("https://api.openai.com/v1/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${apikey}`
        },
        body: JSON.stringify({
          model: "text-davinci-003",
          prompt: fullPrompt,
          max_tokens: 100,
          temperature: 0.9
        })
      });

      const data = await response.json();
      const botReply = data.choices?.[0]?.text?.trim() || "Algo deu errado...";

      messagesDiv.innerHTML += `<div class='message'><span class='bot'>DelíciaBot:</span> ${botReply}</div>`;
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
  </script>
</body>
</html>
