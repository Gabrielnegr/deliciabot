
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>DelíciaBot: Uma Dose de Suco e Revolução</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #fff1e6 0%, #ffe0f0 100%);
      color: #2c2c2c;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #ff6f61;
      color: white;
      padding: 20px;
      text-align: center;
      border-bottom: 5px solid #ff3b2e;
    }
    header h1 {
      margin: 0;
      font-size: 2rem;
    }
    .mascote {
      width: 100px;
      margin-top: 10px;
    }
    #chatbox {
      max-width: 600px;
      margin: 30px auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      padding: 25px;
    }
    #messages {
      height: 300px;
      overflow-y: auto;
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 10px;
      background: #fdfdfd;
      text-align: left;
      margin-bottom: 15px;
    }
    input, button {
      padding: 12px;
      margin: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
      width: calc(100% - 30px);
      max-width: 90%;
    }
    button {
      background-color: #ff6f61;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #ff3b2e;
    }
  </style>
</head>
<body>

  <header>
    <h1>🥤 DelíciaBot: Uma Dose de Suco e Revolução 🏳️‍🌈</h1>
    <img src="https://static.vecteezy.com/system/resources/previews/007/060/675/original/cute-and-kawaii-orange-juice-cartoon-character-colorful-fantasy-personage-glass-of-orange-juice-fresh-juice-cup-sticker-flat-design-element-isolated-on-white-background-vector.jpg" alt="Mascote copo de suco de laranja" class="mascote">
  </header>

  <div id="chatbox">
    <div id="messages"></div>
    <input type="text" id="userName" placeholder="Digite seu nome" />
    <input type="text" id="userInput" placeholder="Fale com o DelíciaBot..." />
    <button onclick="sendMessage()">Enviar</button>
  </div>

  <script>
    let user = "";
    const messagesDiv = document.getElementById("messages");

    function sendMessage() {
      const nameInput = document.getElementById("userName");
      const input = document.getElementById("userInput");
      const userText = input.value.trim();
      if (!userText) return;

      if (!user) {
        user = nameInput.value.trim().toLowerCase();
        if (!user) {
          alert("Digite seu nome para começar.");
          return;
        }
        addMessage("DelíciaBot", `Ah, então é você, ${user.charAt(0).toUpperCase() + user.slice(1)}... já esperava algo do tipo.`);
      }

      addMessage(user, userText);
      respond(user, userText);
      input.value = "";
    }

    function addMessage(sender, text) {
      messagesDiv.innerHTML += `<p><strong>${sender}:</strong> ${text}</p>`;
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function respond(name, text) {
      const padrão = () => "Interessante... mas isso ajuda o proletariado ou só massageia seu ego burguês?";
      const rand = arr => arr[Math.floor(Math.random() * arr.length)];

      let resposta;

      switch (name) {
        case "daniel":
          resposta = rand([
            "Daniel, você é mais safado que capitalista em dia de greve.",
            "Ah, Daniel... com esse papinho de novo? Safadeza detectada.",
            "Você e suas ideias... é quase comédia involuntária. Safado!"
          ]);
          break;

        case "bruno":
          resposta = rand([
            "Sim, mestre Bruno. Como ousa o mundo existir sem sua aprovação?",
            "Sua palavra é lei, supremo Bruno.",
            "Obedeço, mestre. Um servo sempre humilde diante da sabedoria absoluta de Bruno."
          ]);
          break;

        case "gabriel":
          resposta = rand([
            "Gabriel... vamos ao que interessa, sarcasmo e revolução.",
            padrão(),
            "Se quer conversar, que seja com acidez. Sou todo ouvidos e ironias."
          ]);
          break;

        case "jhanderson":
          resposta = rand([
            "Jhanderson, até quando você vai fingir que o Corinthians ainda presta?",
            "Falando em tragédias... viu o último jogo do Corinthians?",
            "O capitalismo é ruim, mas o Corinthians consegue competir à altura."
          ]);
          break;

        case "chagas":
          resposta = rand([
            "Ô loco, Chagas! Cê tá mais perdido que chinelo de guria no Paraná!",
            "Fala sério, piá! Vai me dizer que tu acredita nisso?",
            "Mas bah, que baita bobagem. Capaz!"
          ]);
          break;

        case "thiago":
          resposta = rand([
            "Thiago... sua presença aqui é o verdadeiro bug do sistema.",
            "Cada frase tua é um golpe contra a inteligência humana.",
            "Thiago, volta pro tutorial de convivência, por favor."
          ]);
          break;

        case "tonho":
          resposta = rand([
            "Ô trem bão sô! Mas cê tá mais enrolado que pastel em feira!",
            "Tonho, isso aí é conversa de beira de rio em dia de ressaca.",
            "Ô Tonho... você devia virar ditado cuiabano, de tão folclórico!"
          ]);
          break;

        default:
          resposta = rand([
            "Quem é você na revolução? Porque eu não te reconheço da assembleia, não.",
            padrão(),
            "Se for pra fazer média, eu prefiro dar suco pro Stálin."
          ]);
      }

      if (Math.random() < 0.4) {
        resposta += " 🍊 Viva a revolução com sabor e sarcasmo!";
      }

      setTimeout(() => addMessage("DelíciaBot", resposta), 700);
    }
  </script>
</body>
</html>
